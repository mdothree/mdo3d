<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDO3D — Manage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B12; --bg-2:#14141F; --bg-3:#1C1C2B; --line:#2C2C3D;
    --ink:#ECECF4; --ink-2:#B2B2C6; --ink-3:#6E6E86;
    --signal:#7C5CFF; --signal-deep:#5B3FD0; --ember:#E0673B;
    --ok:#4FB286; --no:#E0607A; --rev:#E0A93B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--signal);text-decoration:none}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  header{position:sticky;top:0;z-index:10;background:rgba(11,11,18,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:20px;padding:14px 24px;max-width:1400px;margin:0 auto}
  .wordmark{font-family:"JetBrains Mono",monospace;font-weight:700;letter-spacing:-.02em;font-size:15px}
  .wordmark .o{color:var(--signal)}
  .tag{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-3);
    letter-spacing:.14em;text-transform:uppercase}
  .spacer{flex:1}
  .tabs{display:flex;gap:4px;padding:0 24px;max-width:1400px;margin:0 auto;flex-wrap:wrap}
  .tab{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-3);background:none;border:0;
    padding:12px 14px;cursor:pointer;border-bottom:2px solid transparent}
  .tab:hover{color:var(--ink-2)}
  .tab.active{color:var(--ink);border-bottom-color:var(--signal)}
  .tab .n{color:var(--signal);margin-left:6px}
  main{max-width:1400px;margin:0 auto;padding:24px;display:grid;
    grid-template-columns:minmax(320px,420px) 1fr;gap:24px;align-items:start}
  .list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 150px);overflow:auto;padding-right:4px}
  .card{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;cursor:pointer;transition:border-color .12s}
  .card:hover{border-color:var(--signal-deep)}
  .card.sel{border-color:var(--signal);background:var(--bg-3)}
  .card.done{opacity:.5}
  .card .row1{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
  .pill{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--ink-3)}
  .pill.v-approve{color:var(--ok);border-color:var(--signal-deep)}
  .pill.v-reject{color:var(--no);border-color:var(--ember)}
  .pill.v-revise{color:var(--rev);border-color:var(--rev)}
  .card h3{margin:0;font-size:14px;font-weight:600;line-height:1.3}
  .card .meta{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-3);margin-top:6px}
  .detail{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;
    padding:24px;min-height:400px;position:sticky;top:96px}
  .detail .kicker{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--signal)}
  .detail h2{margin:8px 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  .detail .sub{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-3);margin-bottom:18px}
  .field{margin:14px 0}
  .field .lab{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
  .field .val{white-space:pre-wrap;color:var(--ink-2)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:"JetBrains Mono",monospace;font-size:11px;padding:3px 8px;border-radius:4px;
    background:var(--bg-3);border:1px solid var(--line);color:var(--ink-2)}
  .body-box{background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:16px;white-space:pre-wrap;color:var(--ink);max-height:46vh;overflow:auto;line-height:1.6}
  .actions{display:flex;gap:10px;margin:20px 0 10px;flex-wrap:wrap}
  button.act{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;padding:11px 18px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line);background:var(--bg-3);color:var(--ink)}
  button.act.approve:hover{border-color:var(--signal);color:var(--ok)}
  button.act.revise:hover{border-color:var(--rev);color:var(--rev)}
  button.act.reject:hover{border-color:var(--ember);color:var(--no)}
  textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;
    color:var(--ink);font-family:Inter,sans-serif;font-size:14px;padding:10px;resize:vertical;min-height:64px}
  .empty{color:var(--ink-3);text-align:center;padding:60px 20px;font-family:"JetBrains Mono",monospace;font-size:13px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--signal-deep);color:var(--ink);padding:10px 18px;border-radius:6px;
    font-family:"JetBrains Mono",monospace;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .hint{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-3)}
  @media(max-width:900px){main{grid-template-columns:1fr}.detail{position:static}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="wordmark">MDO<span class="o">3</span>D</span>
    <span class="tag">Manage</span>
    <span class="spacer"></span>
    <span class="tag" id="summary"></span>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main>
  <div class="list" id="list"><div class="empty">loading…</div></div>
  <div class="detail" id="detail"><div class="empty">select an item</div></div>
</main>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
