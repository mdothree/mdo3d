<!-- site-chrome.html — MDOThree shared template: the nav pieces every MDOThree page carries.
     Source of truth: shared/mdothree/{theme-init.js,site-chrome.js,site-chrome.css,site-chrome.html}.
     Copy the .js files to <surface>/public/js/ and the .css to <surface>/public/css/, then:

     1. <head>, BEFORE the first stylesheet (sets data-theme before paint; CSP forbids inline scripts):
          <script src="/js/theme-init.js"></script>
        and AFTER the surface stylesheet:
          <link rel="stylesheet" href="/css/site-chrome.css" />
     2. The cluster below, as the LAST child of the header/nav row (the theme toggle stays innermost/rightmost).
        On surfaces with a hamburger menu, put the hamburger button inside it, just before the toggle.
     3. Before </body>:
          <script src="/js/site-chrome.js" defer></script>
          <script type="module" src="/js/auth-nav.js"></script>   (per-surface adapter: real Firebase auth
                                                                  state + PRO_CHECKOUT_ENABLED -> mdoChrome)
     4. Bump the surface's service-worker CACHE_NAME and add the three files to its precache list.

     Rules: no status/debug badge anywhere (the old fixed "signed in" text is gone). "Sign in" only renders
     when the surface has a real sign-in flow (none of the 10 has one today); a signed-in Firebase user
     (non-anonymous) gets the account menu with Sign out. Pro says "Pro (coming soon)" and links to
     mdothree.com/pro until PRO_CHECKOUT_ENABLED=true; then auth-nav.js points the same control at checkout. -->
<div class="mdo-actions">
  <a class="mdo-pro" data-mdo-pro href="https://mdothree.com/pro" title="mdothree Pro is coming soon. Nothing to buy yet."><span class="mdo-pro-star" aria-hidden="true">★</span><span class="mdo-pro-main">Pro</span> <span class="mdo-pro-note">(coming soon)</span></a>
  <div class="mdo-account" data-mdo-account hidden></div>
  <button type="button" class="mdo-theme" data-mdo-theme aria-label="Switch theme" title="Switch theme"><svg class="mdo-i mdo-i-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="mdo-i mdo-i-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</div>
