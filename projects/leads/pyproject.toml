[project]
name = "fl-sunbiz-leads"
version = "1.0.0"
description = "FL Sunbiz lead generation pipeline"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=7.0.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
browser = [
    "playwright>=1.40.0",
]
web = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "stripe>=8.0.0",
    "firebase-admin>=6.4.0",
    "pydantic>=2.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
