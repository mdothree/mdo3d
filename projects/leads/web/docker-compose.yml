name: leads

services:
  frontend:
    build: ./frontend
    container_name: leads-frontend
    ports:
      - "3050:3050"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: leads-backend
    ports:
      - "8050:8050"
    env_file:
      - ./backend/.env
    volumes:
      - ../config:/app/config:ro
    restart: unless-stopped
